services:
  postgres:
    image: postgres:16
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Seconde BDD Postgres — stockage données applicatives
  # -------------------------------------------------------
  app_postgres:
    image: postgres:16
    container_name: app_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password        # ← À CHANGER
      - POSTGRES_DB=app_db                    # ← Nom de ta base
    ports:
      - "5433:5432"                           # Port 5433 sur l'hôte pour accès externe (ex: DBeaver)
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      # ↓ Tous les .sql de ce dossier sont exécutés au premier démarrage
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - N8N_ENCRYPTION_KEY=change_this_encryption_key_32chars
      # Base de données PostgreSQL (n8n interne)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password
      - DB_POSTGRESDB_DATABASE=n8n
      # Timeouts et performance
      - EXECUTIONS_TIMEOUT=600
      - EXECUTIONS_TIMEOUT_MAX=600
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      app_postgres:
        condition: service_healthy

volumes:
  n8n_data:
    name: n8n_data
  postgres_data:
    name: n8n_postgres_data
  app_postgres_data:
    name: app_postgres_data