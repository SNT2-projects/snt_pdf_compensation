services:
  # -------------------------------------------------------
  # Postgres interne n8n (jamais exposé)
  # -------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Postgres applicatif — données métier (déclarations, anomalies...)
  # -------------------------------------------------------
  app_postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${APP_POSTGRES_USER}
      - POSTGRES_PASSWORD=${APP_POSTGRES_PASSWORD}
      - POSTGRES_DB=${APP_POSTGRES_DB}
    ports:
      # Accès direct sur le réseau interne : {IP_VM}:5433 (ex: DBeaver natif)
      - "5433:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      # Les .sql sont exécutés au PREMIER démarrage, dans l'ordre alphabétique (01_ → 04_)
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER} -d ${APP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # n8n (mode HTTP, sans domaine)
  # -------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    ports:
      # Accès direct : http://{IP_VM}:5678
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - NODE_ENV=production
      # HTTP → cookie non sécurisé obligatoire (sinon login impossible)
      - N8N_SECURE_COOKIE=false
      # ⚠️ Chiffre TOUTES les credentials. À NE JAMAIS perdre / changer.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Base interne n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - DB_POSTGRESDB_DATABASE=n8n
      # Timeouts / perf
      - EXECUTIONS_TIMEOUT=600
      - EXECUTIONS_TIMEOUT_MAX=600
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      app_postgres:
        condition: service_healthy

  # -------------------------------------------------------
  # CloudBeaver — DBeaver dans le navigateur (consultation BDD)
  # -------------------------------------------------------
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      # Accès direct : http://{IP_VM}:8978
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      app_postgres:
        condition: service_healthy

volumes:
  # Volumes n8n RENOMMÉS (v2) → démarrage propre avec la nouvelle clé de chiffrement.
  # Les anciens (n8n_data / n8n_postgres_data) restent orphelins, à nettoyer plus tard.
  n8n_data:
    name: n8n_data_v2
  postgres_data:
    name: n8n_postgres_data_v2
  # Inchangés
  app_postgres_data:
    name: app_postgres_data
  cloudbeaver_data:
    name: cloudbeaver_data